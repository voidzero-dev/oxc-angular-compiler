name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Enable Git long paths (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --global core.longpaths true

      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@fb003b4f771bbf9c2de31d5f65c40689cc097fb5 # v2.1.0

      - name: Check
        run: cargo check --all-features

      - name: Test
        run: cargo test --all-features

      - name: Format
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: cargo fmt --all -- --check

      - name: Conformance
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          cargo run -p oxc_angular_conformance
          git diff --exit-code

  napi-smoke:
    name: NAPI Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Enable Git long paths (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --global core.longpaths true

      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@fb003b4f771bbf9c2de31d5f65c40689cc097fb5 # v2.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: |
          pnpm build-dev
          pnpm --filter ./napi/angular-compiler build:ts

      - name: Test
        run: pnpm test

  napi:
    name: NAPI Build (Ubuntu E2E)
    # On pull requests. `napi-main` runs the same steps on pushes to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: napi-smoke
    env:
      # Pull requests only read the remote task cache, which needs no credentials.
      VP_REMOTE_CACHE_URL: https://voidzero-remote-cache.voidzero-docs.workers.dev/projects/oxc-angular-compiler
      VP_REMOTE_CACHE: read
    steps: &napi-steps
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@fb003b4f771bbf9c2de31d5f65c40689cc097fb5 # v2.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: |
          pnpm build-dev
          pnpm --filter ./napi/angular-compiler build:ts

      - name: Lint
        run: pnpm check

      - name: Test
        run: |
          pnpm --filter ./napi/angular-compiler exec playwright install --with-deps
          pnpm test:e2e
      # `vp run compare` runs the harness's `compare --fixtures` in two tasks: the ngtsc baseline,
      # which is cached, then the comparison with Oxc (see vite.config.ts).
      - name: Compare tests
        run: pnpm exec vp run compare

  napi-main:
    name: NAPI Build (Ubuntu E2E, main)
    # The steps of `napi`, on pushes to main, the only runs that upload to the remote task cache.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: napi-smoke
    permissions:
      contents: read
      # Uploads authenticate with a GitHub Actions OIDC token.
      id-token: write
    env:
      VP_REMOTE_CACHE_URL: https://voidzero-remote-cache.voidzero-docs.workers.dev/projects/oxc-angular-compiler
      VP_REMOTE_CACHE: read-write
    steps: *napi-steps
